<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Курсы</title>
</head>
<body>
    <h1>Мои курсы</h1>
    <a href="/auth/logout">Выйти</a>
    <ul>
        {% for course in courses %}
            <li>
                <p><a href="/courses/{{ course.id }}">{{ course.code }}</a></p>
                {% if course.discipline %}
                    <p>{{ course.discipline.title }}</p>
                {% endif %}
                <p>Баллы: {{ course.total_score }} / {{ course.total_points }}</p>
            </li>
        {% empty %}
            <li>Курсов нет</li>
        {% endfor %}
    </ul>
</body>
</html>

{% extends "infra/_layout_admin.html" %}

{% block content %}
<div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
<h2 class="font-bold text-primary" style="font-size: 42px;">Студенты</h2>
<form method="get" class="flex flex-row gap-2">
  <select class="select" name="group" onchange="submit">
  <option disabled selected>Фильтр по группе</option>
  {% for group in groups %}
  <option value="{{ group.id }}">{{ group.title }}</option>
  {% endfor %}
</select>
    <input type="text" 
           name="search"
           placeholder="Поиск по фамилии"
           class="input input-primary"/>
    <button type="submit" class="btn btn-primary">Найти</button>
</form>
</div><br/>
  <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
  <table class="table">
    <!-- head -->
    <thead>
      <tr>
        <th>ФИО</th>
        <th>Группа</th>
        <th>Аккаунт</th>
      </tr>
    </thead>
    <tbody>
      {% for student in students %}
      <tr>
        <td>{{ student.first_name }} {{ student.last_name }} {{ student.middle_name }}</td>
        <td>{{ student.group.title }}</td>
        <td>{{ student.account }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}

{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>noLXP</title>
    <link rel="stylesheet" href="{% static 'pico.css' %}">
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<body>
    {% if request.user.is_authenticated %}
    <nav>
      <a href="{% url 'courses' %}">Главная</a>

      <span>{{ request.user.student }}</span>
      <a href="{% url 'logout' %}">Выйти</a>
    </nav>
    {% endif %}

    <h2>
    {% block title %}
    {% endblock %}
    </h2>

    <main>
    {% block content %}
    {% endblock %}
    </main>
</body>
</html>

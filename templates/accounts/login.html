{% extends 'base.html' %}

{% block content %}
<div class="login-container">
    <h2>Вход в систему</h2>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-error">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Войти</button>
    </form>
</div>
{% endblock %}

{% extends '_layout.html' %}

{% block title %}
{{ course.code }} {{ course.title }}
{% endblock %}

{% block content %}
<article>
    <p>Длительность: {{ course.discipline.duration }} ак.ч.</p>

    {% for topic in course.discipline.topic_set.all %}
        <section>
            <a href="{% url 'topic' course.id topic.id %}">{{ topic.title }}</a>
        </section>
    {% endfor %}

</article>
{% endblock %}

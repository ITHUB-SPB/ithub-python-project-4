<!DOCTYPE html>
<html>
<head>
    <title>Список курсов</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .grade-5 { color: green; font-weight: bold; }
        .grade-4 { color: blue; }
        .grade-3 { color: orange; }
        .grade-2 { color: red; }
    </style>
</head>
<body>
    <h1>Список курсов</h1>
    <table>
        <thead>
            <tr>
                <th>Дисциплина</th>
                <th>Группа</th>
                <th>Баллы</th>
                <th>Оценка</th>
            </tr>
        </thead>
        <tbody>
            {% for item in courses_data %}
            <tr>
                <td><a href="{% url 'course_detail' item.course.id %}">{{ item.course.discipline.title }}</a></td>
                <td>{{ item.course.group.name }}</td>
                <td>{{ item.total_score }} из {{ item.total_weight }}</td>
                <td class="grade-{{ item.grade }}">{{ item.grade|default:"-" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Нет доступных курсов</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="{% url 'logout' %}">Выйти</a></p>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Вход</title>
</head>
<body>

    <h1>Авторизация</h1>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <form method="post">
        {% csrf_token %}

        <label>Логин</label>
        <input type="text" name="username">

        <br><br>

        <label>Пароль</label>
        <input type="password" name="password">

        <br><br>

        <button type="submit">
            Войти
        </button>
    </form>

</body>
</html>

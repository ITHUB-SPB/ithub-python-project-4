{% load static %}
<!doctype html>
<html>
	<head>
		<title>Вход</title>
		<link rel="stylesheet" href="{% static 'classless.css' %}" />
	</head>
	<body>
		<h1>Вход в систему</h1>
		{% if messages %}
		<ul style="color: red">
			{% for message in messages %}
			<li>{{ message }}</li>
			{% endfor %}
		</ul>
		{% endif %}
		<form method="post">
			{% csrf_token %}
			<input
				type="text"
				name="username"
				placeholder="Имя пользователя"
				required
			/>
			<input
				type="password"
				name="password"
				placeholder="Пароль"
				required
			/>
			<button type="submit">Войти</button>
		</form>
	</body>
</html>

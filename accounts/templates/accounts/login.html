<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Логин</title>
</head>
<body>
    <h1>Вход</h1>
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Логин">
        <input type="password" name="password" placeholder="Пароль">
        <button type="submit">Войти</button>
    </form>
</body>
</html>
